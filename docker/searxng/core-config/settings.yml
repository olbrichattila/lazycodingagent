# Minimal SearXNG config for LazyCodingAgent (web_search uses format=json).
# https://docs.searxng.org/admin/settings/settings.html

use_default_settings: true

general:
  debug: false
  instance_name: "SearXNG (LazyCodingAgent local)"

search:
  formats:
    - html
    - json

server:
  # secret_key: set via SEARXNG_SECRET in .env (required; default "ultrasecretkey" is rejected)
  limiter: false
  image_proxy: false
  bind_address: "[::]"

valkey:
  url: valkey://valkey:6379/0
