name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(.+)$') {
            throw "Expected tag vX.Y.Z, got: $tag"
          }
          $version = $Matches[1]
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Empty version after v prefix on tag: $tag"
          }
          "APP_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Release version: $version"

      - name: Install Lazarus (Chocolatey)
        run: choco install lazarus -y --no-progress

      - name: Prepare SynEdit and TurboPower IPro
        shell: pwsh
        env:
          LAZBUILD: C:\lazarus\lazbuild.exe
          LAZARUS_DIR: C:\lazarus
        run: |
          if (-not (Test-Path -LiteralPath $env:LAZBUILD)) {
            $env:LAZBUILD = (Get-Command lazbuild).Source
          }
          ./scripts/ci-prepare-lazarus-deps.ps1 -LazBuild $env:LAZBUILD

      - name: Link LCA and terminal packages
        shell: pwsh
        env:
          LAZBUILD: C:\lazarus\lazbuild.exe
        run: |
          if (-not (Test-Path -LiteralPath $env:LAZBUILD)) {
            $env:LAZBUILD = (Get-Command lazbuild).Source
          }
          & $env:LAZBUILD --version
          ./scripts/install-lca-lazarus.ps1 -LinkOnly

      - name: Install Python deps (owl branding)
        run: python -m pip install --upgrade pip pillow

      - name: Owl branding (BMP resource + EXE icon)
        shell: cmd
        run: scripts\gen-owl-branding.bat

      - name: lazbuild
        shell: pwsh
        env:
          LAZBUILD: C:\lazarus\lazbuild.exe
        run: ./scripts/ci-lazbuild.ps1

      - name: Post-build deploy
        shell: pwsh
        run: ./scripts/post-build.ps1

      - name: Install Inno Setup (Chocolatey)
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-windows-installer.ps1 -Version $env:APP_VERSION

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: dist/*-Setup.exe
          if-no-files-found: error

  build-linux:
    # 22.04 apt ships Lazarus 2.2 (no TurboPower IpHtmlTypes); 24.04 has Lazarus 3.0+.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(.+)$ ]]; then
            echo "Expected tag vX.Y.Z, got: $tag" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if [[ -z "$version" ]]; then
            echo "Empty version after v prefix on tag: $tag" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Release version: $version"

      - name: Qt5 release build
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci-linux-qt5-release-build.sh

      - name: Build DEB package
        run: ./scripts/build-linux-deb.sh

      - name: Build AppImage
        run: ./scripts/build-linux-appimage.sh

      - name: Smoke test AppImage (xvfb)
        run: |
          set -euo pipefail
          APPIMAGE=(dist/*.AppImage)
          if [[ ! -f "${APPIMAGE[0]}" ]]; then
            echo "AppImage not found under dist/" >&2
            exit 1
          fi
          chmod +x "${APPIMAGE[0]}"
          # Brief launch under Xvfb; exit when the process ends (user closes or startup error).
          timeout 15 xvfb-run -a env APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=xcb "${APPIMAGE[0]}" || code=$?
          if [[ "${code:-0}" -eq 124 ]]; then
            echo "Smoke test: app still running after 15s (OK)"
            exit 0
          fi
          exit "${code:-0}"

      - name: Upload Linux packages
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: |
            dist/*.deb
            dist/*.AppImage
          if-no-files-found: error

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Resolve release version
        run: |
          tag="${GITHUB_REF_NAME}"
          if [[ ! "$tag" =~ ^v(.+)$ ]]; then
            echo "Expected tag vX.Y.Z, got: $tag" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          if [[ -z "$version" ]]; then
            echo "Empty version after v prefix on tag: $tag" >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "Release version: $version"

      - name: Cache Lazarus SourceForge downloads
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/lazarus-ci
          key: macos-lazarus-4.8-${{ hashFiles('scripts/ci-install-lazarus-macos.sh') }}

      - name: Install Free Pascal and Lazarus (SourceForge)
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci-install-lazarus-macos.sh

      - name: macOS release build
        run: ./scripts/ci-macos-release-build.sh

      - name: Build DMG
        run: ./scripts/build-macos-dmg.sh

      - name: Smoke test app bundle
        run: |
          set -euo pipefail
          APP="build/macos-bundle/Lazy Coding Agent.app"
          if [[ ! -d "$APP/Contents/MacOS" ]]; then
            echo "App bundle not found at $APP" >&2
            exit 1
          fi
          BIN="$APP/Contents/MacOS/lazycodingagent"
          chmod +x "$BIN"
          timeout 15 "$BIN" || code=$?
          if [[ "${code:-0}" -eq 124 ]]; then
            echo "Smoke test: app still running after 15s (OK)"
            exit 0
          fi
          exit "${code:-0}"

      - name: Upload macOS DMG
        uses: actions/upload-artifact@v4
        with:
          name: release-macos
          path: dist/*.dmg
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [build-windows, build-linux, build-macos]
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: release-windows
          path: dist

      - name: Download Linux artifact
        uses: actions/download-artifact@v4
        with:
          name: release-linux
          path: dist

      - name: Download macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: release-macos
          path: dist

      - name: Resolve release version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: LazyCodingAgent ${{ env.APP_VERSION }}
          files: |
            dist/*-Setup.exe
            dist/*.deb
            dist/*.AppImage
            dist/*.dmg
          fail_on_unmatched_files: true
          generate_release_notes: true
