name: Build

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Lazarus and build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git fpc lazarus lcl fp-units-rtl fp-units-fcl fp-units-misc \
            libgtk2.0-dev libgdk-pixbuf2.0-dev libglib2.0-dev libnotify-dev \
            libxml2-dev libxslt1-dev

      - name: Prepare SynEdit and TurboPower IPro
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci-prepare-lazarus-deps.sh

      - name: Link LCA and terminal packages
        run: ./scripts/install-lca-lazarus.sh --link-only

      - name: lazbuild
        run: lazbuild lazycodingagent.lpi

      - name: Post-build deploy
        run: ./scripts/post-build.sh

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Lazarus (Chocolatey)
        run: choco install lazarus -y --no-progress

      - name: Prepare SynEdit and TurboPower IPro
        shell: pwsh
        env:
          LAZBUILD: C:\lazarus\lazbuild.exe
          LAZARUS_DIR: C:\lazarus
        run: |
          if (-not (Test-Path -LiteralPath $env:LAZBUILD)) {
            $env:LAZBUILD = (Get-Command lazbuild).Source
          }
          ./scripts/ci-prepare-lazarus-deps.ps1 -LazBuild $env:LAZBUILD

      - name: Link LCA and terminal packages
        shell: pwsh
        env:
          LAZBUILD: C:\lazarus\lazbuild.exe
        run: |
          if (-not (Test-Path -LiteralPath $env:LAZBUILD)) {
            $env:LAZBUILD = (Get-Command lazbuild).Source
          }
          & $env:LAZBUILD --version
          ./scripts/install-lca-lazarus.ps1 -LinkOnly

      - name: Owl branding (BMP resource + EXE icon)
        shell: cmd
        run: scripts\gen-owl-branding.bat

      - name: lazbuild
        shell: pwsh
        env:
          LAZBUILD: C:\lazarus\lazbuild.exe
        run: |
          if (-not (Test-Path -LiteralPath $env:LAZBUILD)) {
            $env:LAZBUILD = (Get-Command lazbuild).Source
          }
          & $env:LAZBUILD lazycodingagent.lpi

      - name: Post-build deploy
        shell: pwsh
        run: ./scripts/post-build.ps1

  build-macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Free Pascal and Lazarus (SourceForge)
        run: |
          chmod +x scripts/*.sh
          ./scripts/ci-install-lazarus-macos.sh

      - name: Prepare SynEdit and TurboPower IPro
        run: ./scripts/ci-prepare-lazarus-deps.sh

      - name: Link LCA and terminal packages
        run: ./scripts/install-lca-lazarus.sh --link-only --widgetset=cocoa

      - name: lazbuild
        run: lazbuild --widgetset=cocoa lazycodingagent.lpi

      - name: Post-build deploy
        run: ./scripts/post-build.sh
